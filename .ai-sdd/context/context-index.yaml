# SDD Context Index（YLCraft）
#
# 用途：`.ai-sdd/context/` 的唯一活跃入口。先按 stage/scope 筛选，再按 load_policy 最小加载。
#
# path:
#   - 以 .md 结尾：直接按需读取单文件
#   - 以 / 结尾：目录型上下文；先读该目录 README.md，再按需读取具体文件
# scope:  本项目为单仓（FastAPI 后端 + React 前端），统一使用 all
# stage:  proposal / specs / design / tasks / apply / verify / all
# load_policy: always / stage-start / stage-end / on-demand
# triggers: on-demand 的强制路由提示（中文业务说法、代码符号均算命中）
