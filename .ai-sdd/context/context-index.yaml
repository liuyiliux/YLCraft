# 工程约束

- path: engineering/设计约束（design-conventions）.md
  summary: "AI 调用双层观测模式、任务不能自动收口、重试复用业务端点、前端选项同步、函数直调的坑；写作风格 T6 预算与纯函数注入、人机边界对等、TOOLS 注册表判定；Agent 工作台前端约束（窄屏禁用 nth-child、tabular-nums 非等宽、JSX 注释、!important 覆盖、勾选项审计）；世界构建约束（复用管线半段、origin 放候选级、schema 边界前移、同步判据、design 可能滞后于 tasks）；Creative Skill 约定与检索陷阱（Select-String 不递归子目录）；派生状态优先渲染时计算、/story 实现已迁至 components/；数据库迁移约束（version_num 长度、仅运行时建表、env.py 全量导入、禁止 stamp）；动态状态约束（LLM 输出字段驱动、纯服务优先、注入分层、无新路由不改 API surface）；叙事运行时约束（T0 不静默截断、异步生图不算正文成功、熔断恢复需显式动作）；Agent 工作台信息架构约束（三条产品约束、手写 markdown 解析器）；小说来源与世界提取约束（逐字证据、递归检索、内置字段只增不删、smoke:pages 只是源码扫描）；创作项目闭环约束（模板兼容、生图谱系字段须齐且索引字段为字符串、生成单元独立存储、实验模块不进主流程）；提示词参考库约束（JSONB 分面聚合、非法枚举值不应静默忽略、测试选择器须复核源码、缓存媒体本地优先）；图转 3D 验证坑（history 过滤 pending、表单默认折叠、按钮文案、toast 3 秒消失、真实生成扣额度须先确认）；角色册实现约束（Bible 分节类型不一、identity 键不固定、弱化要给选中态留出口、窄栏排版）；视频生成约束（项目 role=output、WebSocket 协议须跟随页面、图生视频需公网首帧）"
  scope: all
  stage: [design, tasks, apply]
  load_policy: on-demand
  triggers:
    - "设计涉及新增 AI 调用、生成操作、异步任务或可观测性"
    - "需要判断是否该记事件、是否该建任务、失败后如何重试"
    - "实现需要直接调用其他端点函数（如 await generate_video(req)）"
    - "涉及写作风格注入、T6 层预算、Context Pack 组装"
    - "需要判断 AI 能力是否在真人 UI 与 Agent 工具两侧都有对应入口"
    - "改动 /agent 工作台的顶栏、卡片样式、响应式折叠或遥测展示"
    - "扩展世界构建能力、新增生成动作或改动域契约"
    - "新增或修改 Creative Skill 方法包、判断某阶段能否生成"
    - "需要新增进度/完成类字段（先判断能否渲染时计算）"
    - "需要新增运行时 create_all / ALTER TABLE 或改动迁移链"
    - "需要新增随剧情变化的状态类数据"
    - "涉及 T0-T6 上下文分层、context_overflow 或生成上下文泄漏"
    - "改动 /agent 的信息层级、辅助接口错误处理或产品约束"
    - "涉及生图回写项目谱系（lineage 字段与类型）"
    - "涉及阶段产出如何存储与版本化"
    - "涉及大数据量标签/分面筛选"
    - "引用任务里记录的测试选择器（可能已过时）"
    - "涉及 /model-3d 工作台的自动化验证"
    - "准备触发真实生成（先确认费用）"
    - "改动角色册/角色列表的展示或完善度"
    - "排查实时进度/WebSocket 连不上"
    - "校验视频是否入了项目谱系"

    - "涉及 WorldEntity / WorldEntityRelation / 世界地图正典与成图边界"
    - "需要做真实 UI 验证（注意 smoke:pages 不是浏览器）"
