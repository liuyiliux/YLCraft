- path: business/业务规则与核验体系（business-rules）.md
  summary: "任务落库白名单规则、启动对账、事件/任务重试边界、事件敏感字段与长度约束；写作风格档案生命周期、材料闸门与泄漏阈值、强度注入量；Agent 工作台规则（顶栏写回配置、拒绝=取消运行、有数据才显示、缺失 --、卡片收敛例外、按类名折叠）；世界构建规则（结构过闸、不伪造证据、apply 唯一写入、内置字段只增不删、契约外转建议、幂等指纹）；写作前置检查规则（preflight 只读、返回契约固定、生成方法权威、opt-in 方法包默认不生效）；制作台规则（不持久化派生阶段状态、六条完成度定义、计数仅作指示、批量生产非破坏性收纳）；数据库迁移安全规则（升级是运维动作、运行时 DDL 须有归宿、先备份、迁移测试只用一次性库）；创作项目动态状态规则（内容自由信封有 schema、append-only 去重、折叠语义、隔离原则）；叙事运行时规则（正典 vs 提案分界、派生状态可溯源、supersede 不销毁、aftermath 幂等、失败隔离）；Agent 工作台信息架构规则（主任务优先、辅助失败不阻塞聊天）；小说来源与世界提取规则（证据逐字命中否则丢弃、候选先于正典、apply 唯一写入点、角色复用 Character）；创作项目闭环规则（阶段感知生成、JSON-first 校验与一次修复、生成单元独立存储、生成资产必须记录谱系）；提示词参考库规则（引用不自动入素材库、同步本地优先、按来源+外部 id 去重、分面彼此独立）；图转 3D 规则（输入守卫、结果入资产中枢带谱系、供应商 id 与本地 id 分离、绑骨需公网可达源模型）；角色册与角色流程规则（两类流程门禁不同、字段来源分层、完善度只用列表字段且阈值按真实填充率设计）；视频生成规则（提交不阻塞、终态只入库一次、项目谱系 role=output、图生视频需公网首帧）"
  scope: all
  stage: [specs, design, tasks]
  load_policy: on-demand
  triggers:
    - "涉及任务是否需要持久化、project_id 归属、任务重启恢复"
    - "涉及失败重试、事件重发、可重放参数"
    - "涉及事件日志内容约束（脱敏、截断、条数上限）"
    - "涉及风格档案生命周期（草稿/审核/激活/归档/取消归档）"
    - "涉及来源材料泄漏检查、导入 Skill 的免检边界"
    - "涉及待确认横幅、确认卡片、拒绝工具确认"
    - "涉及 Agent run 的 token/成本/耗时展示，或遥测字段缺失时的兜底"
    - "涉及世界构建的结构建议过闸、候选来源标记、正典写入通道"
    - "涉及写作前置检查、writing-preflight、Creative Skill 方法包"
    - "涉及 /story 制作台、阶段轨、阶段完成度"
    - "涉及 Alembic 迁移、建表改表、schema 变更、部署前备份升级"
    - "涉及创作项目动态状态、随章节变化的角色/世界状态"
    - "涉及已批准正文派生叙事状态、aftermath 管线、源版本 supersede"
    - "涉及哪些数据能进入生成上下文（正典/提案分界）"
    - "涉及 /agent 辅助接口失败时的局部重试与不阻塞聊天"
    - "涉及抽取值必须逐字命中证据、候选如何转为正典"
    - "涉及完本来源派生项目、连载增量同步与锚点稳定性"
    - "涉及某阶段生成能用哪些上游产物"
    - "涉及生成失败如何修复与留痕、生成物谱系字段"
    - "涉及提示词引用是否进素材库、来源同步策略"
    - "涉及绑骨为何失败（源模型需公网可达）"
    - "涉及角色册、完善度、Bible 摘要"
    - "涉及角色两类流程（提取 vs 角色先行）与字段来源"
    - "涉及视频提交/轮询/入库或视频项目谱系"

