# YLCraft Provider 配置
# Image / Video / ComfyUI / Embedding 各类型 Provider 注册表
# 注：LLM 和 TTS backend 已全部迁移至数据库驱动，不再通过 YAML 配置

providers:
  # ========== Image ==========
  seedance:
    media_type: image
    provider: minimax
    model: seedance-2.0
    api_base: https://api.minimax.chat/v1
    api_key: "${MINIMAX_API_KEY}"
    default_model: "seedance-2.0"

  # ========== Video ==========
  minimax-video:
    media_type: video
    provider: minimax
    model: seedance-2.0
    api_base: https://api.minimax.chat/v1
    api_key: "${MINIMAX_API_KEY}"
    default_model: "seedance-2.0"

  # ========== Live2D - Image Processing ==========
  # 抠图 - Remove.bg
  removebg:
    media_type: image-processing
    provider: removebg
    model: "briaai/RMBG-1.4"
    api_base: https://api.remove.bg/v1.0/removebg
    api_key: "${REMOVEBG_API_KEY}"
    default_model: "briaai/RMBG-1.4"

  # 风格转换 - Replicate (SDXL)
  replicate-sdxl:
    media_type: image-processing
    provider: replicate
    model: "stability-ai/sdxl:7762fd07cf94fe5929fae8bf3b1b78ad6eb85b0b4e3afc9d5ccd6b95a85f6d2"
    api_base: https://api.replicate.com/v1
    api_key: "${REPLICATE_API_KEY}"
    default_model: "stability-ai/sdxl"

  # 图像分割 - Hugging Face Inference
  huggingface-segmentation:
    media_type: image-processing
    provider: huggingface
    model: "ZigBread/BiRefNet"
    api_base: https://api-inference.huggingface.co/models
    api_key: "${HUGGINGFACE_API_KEY}"
    default_model: "ZigBread/BiRefNet"

  # ========== ComfyUI ==========
  comfyui-image:
    media_type: comfyui
    server_url: http://127.0.0.1:8188
    workflow_dir: backend/app/services/comfyui/workflows
    output_dir: storage/comfyui/outputs
    provides:
      - image
    default_model: sd15
    default_workflow: txt2img

# ========== Embedding ==========
  qwen-embedding:
    media_type: embedding
    provider: qwen
    model: Qwen/Qwen3-Embedding-8B
    api_base: https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding
    api_key: "${QWEN_API_KEY}"
    default_model: "Qwen/Qwen3-Embedding-8B"
    dimension: 4096

  bge-m3:
    media_type: embedding
    provider: huggingface
    model: BAAI/bge-m3
    api_base: https://api-inference.huggingface.co/models/BAAI/bge-m3
    api_key: "${HUGGINGFACE_API_KEY}"
    default_model: "BAAI/bge-m3"
    dimension: 1024

  openai-embedding:
    media_type: embedding
    provider: openai
    model: text-embedding-3-large
    api_base: https://api.openai.com/v1
    api_key: "${OPENAI_API_KEY}"
    default_model: "text-embedding-3-large"
    dimension: 3072

# 全局默认值
defaults:
  image: seedance
  video: minimax-video
  embedding: qwen-embedding
  # Live2D 各环节默认 provider
  live2d_rembg: removebg
  live2d_style_transfer: replicate-sdxl
  live2d_segmentation: huggingface-segmentation
  # ComfyUI 可选为图像生成后端
  # image: comfyui-image  # 取消注释以使用 ComfyUI 作为默认图像后端
