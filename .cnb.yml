$:
  vscode:
    - docker:
        # build 使用 .ide/Dockerfile（已安装 code-server → 单容器模式）
        # image 为构建失败时的回退镜像（cnbcool/default-dev-env 自带 code-server，仍保持单容器）
        build: .ide/Dockerfile
        image: cnbcool/default-dev-env:latest
      services:
        - vscode
        - docker
      stages:
        - name: init
          script: |
            apt-get update && apt-get install -y --no-install-recommends python3-venv curl
            curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
            apt-get install -y --no-install-recommends nodejs
            python3 --version && node --version
            echo '环境就绪'

main:
  push:
    - name: build-and-check
      runner: { cpus: 2 }
      docker:
        image: python:3.11-slim
      services:
        - docker
      env:
        POSTGRES_DB: ylcraft
        POSTGRES_USER: ylcraft
        POSTGRES_PASSWORD: ylcraft_dev
        DATABASE_URL: postgresql+asyncpg://ylcraft:ylcraft_dev@localhost:5432/ylcraft
        REDIS_URL: redis://localhost:6379/0
      stages:
        - name: backend-check
          script: |
            apt-get update && apt-get install -y --no-install-recommends > /dev/null 2>&1
            cd backend
            pip install -q --upgrade pip
            pip install -q -r requirements.txt
            python -c "from app.main import app; print('Backend import OK')"
        - name: frontend-check
          image: node:20
          script: |
            cd frontend
            npm ci 2>/dev/null || npm install
            npm run build
          ifModify: ["frontend/**"]