name: Public Release Audit

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check tracked release artifacts and credential-shaped values
        run: python tools/audit_public_release.py
