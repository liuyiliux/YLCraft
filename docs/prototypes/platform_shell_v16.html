<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>YLCraft 平台壳 · v16</title>
<style>
  :root{
    --bg:#08080a; --bg2:#0b0b0e; --s1:#101013; --s2:#16161a; --s3:#1c1c21;
    --ln:rgba(255,255,255,.065); --ln2:rgba(255,255,255,.11); --ln3:rgba(255,255,255,.18);
    --tx:#f0f0f3; --tx2:#9c9ca8; --tx3:#63636e;
    --ac:#22d3ee; --acs:rgba(34,211,238,.13); --acl:rgba(34,211,238,.4);
    --ok:#34d399; --wn:#fbbf24; --wnl:rgba(251,191,36,.45); --dg:#f87171;
    --r1:5px;--r2:8px;--r3:12px;--r4:16px;
    --sh2:0 6px 22px -8px rgba(0,0,0,.85);
    --sh3:0 24px 70px -20px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.07);
    --ez:cubic-bezier(.16,1,.3,1);
    --fs:'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    --fm:'JetBrains Mono',Consolas,monospace;
    --nav:216px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--tx);font-family:var(--fs);font-size:13px;
       line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden;
       -webkit-user-select:none;user-select:none}
  button{font-family:inherit}
  .hidden{display:none!important}
  .ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.55;
      stroke-linecap:round;stroke-linejoin:round;display:block;flex:0 0 auto}
  .ic.sm{width:14px;height:14px;stroke-width:1.7}
  .b{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--tx2);
     background:transparent;border:1px solid transparent;padding:6px 10px;border-radius:var(--r2);
     cursor:pointer;transition:all .22s var(--ez);white-space:nowrap;flex:0 0 auto}
  .b:hover{color:var(--tx);background:var(--s3)}
  .b.out{border-color:var(--ln);background:var(--s1)}
  .b.solid{color:#04222a;background:var(--ac);font-weight:600}

  /* ================= 左侧导航 ================= */
  .shell{display:flex;height:100vh}
  .nav{width:var(--nav);flex:0 0 var(--nav);background:var(--bg2);border-right:1px solid var(--ln);
    display:flex;flex-direction:column;min-height:0;z-index:30}
  .navtop{padding:12px 12px 8px;display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:8px;padding:5px 9px 5px 6px;border-radius:var(--r2);
    background:var(--s1);border:1px solid var(--ln);flex:1;min-width:0}
  .brand .mk{width:20px;height:20px;border-radius:var(--r1);background:var(--ac);
    display:flex;align-items:center;justify-content:center;color:#04222a;font-weight:800;font-size:11px;flex:0 0 auto}
  .brand .bn{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 用户 + 花费 */
  .userbox{margin:0 12px 10px;padding:7px 9px;border-radius:var(--r3);background:var(--s1);
    border:1px solid var(--ln);display:flex;align-items:center;gap:8px;cursor:pointer;
    transition:all .2s var(--ez);flex:0 0 auto}
  .userbox:hover{border-color:var(--ln2);background:var(--s2)}
  .avt{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;color:#0a0a0c;flex:0 0 auto}
  .avt.sm{width:18px;height:18px;font-size:9px}
  .ub-i{flex:1;min-width:0}
  .ub-n{font-size:11.5px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ub-c{font-size:10px;font-family:var(--fm);color:var(--ac);margin-top:1px}

  .navscroll{flex:1;overflow-y:auto;padding:0 6px 12px;min-height:0}
  .navscroll::-webkit-scrollbar{width:5px}
  .navscroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}

  .ngroup{margin-bottom:2px}
  .nhead{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--r2);
    font-size:12.5px;color:var(--tx2);cursor:pointer;transition:all .18s var(--ez)}
  .nhead:hover{background:var(--s2);color:var(--tx)}
  .nhead.open{color:var(--tx)}
  .nhead.active{background:var(--acs);color:var(--ac);font-weight:600}
  .nhead .chev{margin-left:auto;transition:transform .22s var(--ez);opacity:.5}
  .nhead.open .chev{transform:rotate(90deg)}
  .nhead .cnt{font-size:9.5px;font-family:var(--fm);color:var(--tx3);margin-left:auto}
  .nhead.open .cnt{display:none}
  .nsub{padding-left:6px;overflow:hidden}
  .nitem{display:flex;align-items:center;gap:8px;padding:5px 9px 5px 26px;border-radius:var(--r1);
    font-size:11.5px;color:var(--tx3);cursor:pointer;transition:all .16s var(--ez)}
  .nitem:hover{background:var(--s2);color:var(--tx2)}
  .nitem.on{background:var(--s2);color:var(--tx)}
  .nitem .dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5;flex:0 0 auto}
  .nitem.on .dot{opacity:1;background:var(--ac)}
  .nitem .tag{font-size:8.5px;color:var(--wn);border:1px solid var(--wnl);border-radius:3px;
    padding:0 3px;margin-left:auto;flex:0 0 auto}

  .navfoot{border-top:1px solid var(--ln);padding:8px 6px;flex:0 0 auto}
  .nitem.plain{padding-left:9px}

  /* ================= 右侧内容 ================= */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}

  /* 画布：整屏嵌 iframe */
  .frame{flex:1;border:0;width:100%;height:100%;display:block;background:var(--bg)}

  /* 普通页面 */
  .page{flex:1;overflow-y:auto;padding:24px 28px;min-height:0}
  .page::-webkit-scrollbar{width:8px}
  .page::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
  .ph{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}
  .ph h1{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .ph p{font-size:12px;color:var(--tx3);margin-top:4px;line-height:1.6;max-width:660px}
  .ph p b{color:var(--tx2)}
  .ph .sp{margin-left:auto;display:flex;gap:8px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r3);padding:14px;
    cursor:pointer;transition:all .22s var(--ez)}
  .card:hover{border-color:var(--ln2);transform:translateY(-2px);box-shadow:var(--sh2)}
  .card .ci{width:30px;height:30px;border-radius:var(--r2);background:var(--s3);color:var(--tx2);
    display:flex;align-items:center;justify-content:center;font-size:14px;margin-bottom:10px}
  .card:hover .ci{background:var(--ac);color:#04222a}
  .card .cn{font-size:12.5px;color:var(--tx);margin-bottom:3px}
  .card .cd{font-size:10.5px;color:var(--tx3);line-height:1.55}
  .card .cm{font-size:10px;font-family:var(--fm);color:var(--ac);margin-top:8px}

  .secttl{font-size:11px;color:var(--tx3);letter-spacing:.05em;margin:20px 0 9px;
    display:flex;align-items:center;gap:8px}
  .secttl::after{content:'';flex:1;height:1px;background:var(--ln)}

  .emptyhint{background:var(--s1);border:1px dashed var(--ln2);border-radius:var(--r3);
    padding:26px;text-align:center;color:var(--tx3);font-size:12px;line-height:1.7}
  .emptyhint b{color:var(--tx2)}

  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:500;
    display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--tx);
    background:rgba(16,16,19,.97);backdrop-filter:blur(24px);border-radius:999px;
    padding:7px 15px;box-shadow:0 12px 34px -10px rgba(0,0,0,.9);animation:ti .3s var(--ez)}
  @keyframes ti{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

  /* 知识库 v2 */
  .kbtop{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .kbbrain{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--ln);
    border-radius:var(--r2);padding:5px 11px}
  .kbbrain-ic{color:var(--ac);font-size:11px}
  .kbbrain select{background:0;border:0;color:var(--tx);font-family:inherit;font-size:12px;
    outline:none;cursor:pointer;padding-right:4px}
  .kbbrain select option{background:var(--s1);color:var(--tx)}
  .kbdim{font-size:9.5px;font-family:var(--fm);color:var(--tx3);padding-left:8px;
    border-left:1px solid var(--ln)}
  .kbtabs{display:flex;gap:1px;padding:2px;background:var(--s1);border:1px solid var(--ln);border-radius:var(--r2)}
  .kbtab{font-size:11.5px;color:var(--tx3);background:0;border:0;padding:4px 12px;
    border-radius:var(--r1);cursor:pointer;transition:all .18s var(--ez)}
  .kbtab.on{background:var(--s3);color:var(--tx);font-weight:500}
  .kbfoot{font-size:10.5px;color:var(--tx3);margin-top:14px;padding-top:10px;border-top:1px solid var(--ln)}
  .kbfoot b{color:var(--wn)}

  .kbsearch2{margin-bottom:10px}
  .kbsbox{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--ln);
    border-radius:var(--r2);padding:7px 12px}
  .kbsbox input{flex:1;background:0;border:0;outline:none;color:var(--tx);font-family:inherit;font-size:12px}
  .kbsbox input::placeholder{color:var(--tx3)}
  .kbhybrid{font-size:9.5px;color:var(--ac);border:1px solid var(--acl);border-radius:3px;
    padding:1px 6px;flex:0 0 auto}

  .kbrow2{display:flex;gap:12px;align-items:flex-start}
  .kbside{width:158px;flex:0 0 158px}
  .ksg{font-size:9.5px;color:var(--tx3);letter-spacing:.05em;padding:10px 6px 5px}
  .ksi{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:var(--r1);
    font-size:11.5px;color:var(--tx3);cursor:pointer;transition:all .16s var(--ez)}
  .ksi:hover{background:var(--s2);color:var(--tx2)}
  .ksi.on{background:var(--acs);color:var(--ac)}
  .ksc{margin-left:auto;font-size:10px;font-family:var(--fm);opacity:.7}
  .kstags{display:flex;flex-wrap:wrap;gap:4px;padding:2px 6px}
  .kstag{font-size:10px;color:var(--tx3);background:var(--s2);border-radius:3px;
    padding:2px 7px;cursor:pointer;transition:all .16s var(--ez)}
  .kstag:hover{background:var(--s3);color:var(--tx2)}
  .kblist2{flex:1;min-width:0}
  .kbfilters2{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
  .kbf{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx3);
    background:var(--s1);border:1px solid var(--ln);border-radius:999px;padding:4px 10px;
    cursor:pointer;transition:all .18s var(--ez)}
  .kbf:hover{color:var(--tx2);border-color:var(--ln2)}
  .kbf.on{color:var(--tx);border-color:var(--acl);background:var(--acs)}
  .kbd{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
  .kbunread{width:5px;height:5px;border-radius:50%;background:var(--ac);display:inline-block}

  /* 条目行（共用） */
  .kbrow{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;background:var(--s1);
    border:1px solid var(--ln);border-radius:var(--r3);cursor:pointer;transition:all .2s var(--ez);
    margin-bottom:6px}
  .kbrow:hover{border-color:var(--ln2);background:var(--s2);transform:translateX(2px)}
  .kbic{width:28px;height:28px;border-radius:var(--r2);border:1px solid;display:flex;
    align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}
  .kbi{flex:1;min-width:0}
  .kbt{font-size:12.5px;color:var(--tx);display:flex;align-items:center;gap:7px}
  .kbpend{font-size:9px;color:var(--wn);border:1px solid var(--wnl);border-radius:3px;padding:0 4px}
  .kbf2{font-size:10.5px;color:var(--tx3);margin-top:2px}
  .kbtags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
  .kbtag{font-size:9px;color:var(--tx3);background:var(--s3);border-radius:3px;padding:1px 5px}
  .kbsrc{font-size:10px;flex:0 0 auto;opacity:.85}

  /* 问答视图 */
  .kbqa2{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r3);padding:16px 18px}
  .kqq{font-size:13px;color:var(--tx);margin-bottom:8px}
  .kqa2{font-size:11.5px;color:var(--tx2);line-height:1.7;margin-bottom:14px}
  .kqa2 b{color:var(--tx)}
  .kbhit2{background:var(--bg2);border:1px solid var(--ln);border-radius:var(--r2);
    padding:10px 12px;margin-bottom:7px}
  .kbhit2.weak{opacity:.75;border-style:dashed}
  .kbhh2{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--tx3);margin-bottom:5px}
  .kbnum{font-family:var(--fm);color:var(--ac)}
  .kbsco{font-family:var(--fm);font-size:10px;color:var(--ok);background:rgba(52,211,153,.12);
    border-radius:3px;padding:0 5px}
  .kbsco.w{color:var(--wn);background:rgba(251,191,36,.12)}
  .kbht2{color:var(--tx2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
  .kbhp2{margin-left:auto;flex:0 0 auto;font-size:10px;opacity:.7}
  .kbsrc2{font-size:10px;flex:0 0 auto}
  .kbhx{font-size:11.5px;color:var(--tx2);line-height:1.65}
  .kbhw{font-size:9.5px;color:var(--wn);margin-top:5px}
  .kbnote2{margin-top:12px;padding:10px 12px;border-radius:var(--r2);font-size:10.5px;
    line-height:1.7;color:var(--tx3);background:var(--acs);border:1px solid var(--acl)}
  .kbnote2 b{color:var(--tx2)}
  .kbqafoot{margin-top:11px;font-size:10px;color:var(--tx3);padding-top:9px;border-top:1px solid var(--ln)}

  /* 条目详情扩展：标注 / 引用记录 */
  .kbd3tip{margin-top:12px;padding:9px 11px;border-radius:var(--r2);font-size:10.5px;
    line-height:1.65;color:var(--tx3);background:var(--bg2);border:1px solid var(--ln)}
  .kbd3tip b{color:var(--tx2)}
  .kbd3tip.ref{background:var(--acs);border-color:var(--acl)}
  .kbusetag{font-size:8.5px;color:var(--ac);border:1px solid var(--acl);border-radius:3px;
    padding:0 4px;margin-left:4px}
  .kbempty{padding:22px 18px;text-align:center}
  .kbempty-t{font-size:12.5px;color:var(--tx2);margin-bottom:6px}
  .kbempty-s{font-size:11px;color:var(--tx3);line-height:1.75}
  .kbempty-s b{color:var(--tx2)}
  /* 标注 */
  .kbann{background:var(--bg2);border-left:2px solid var(--wn);border-radius:0 var(--r2) var(--r2) 0;
    padding:10px 12px;margin-bottom:8px}
  .kbann-q{font-size:11.5px;color:var(--tx2);line-height:1.6;margin-bottom:6px;
    font-style:normal}
  .kbann-seg{font-size:9.5px;color:var(--tx3);font-family:var(--fm);margin-left:6px}
  .kbann-n{font-size:11.5px;color:var(--tx);line-height:1.7;padding-top:6px;
    border-top:1px dashed var(--ln)}
  .kbann-m{font-size:9.5px;color:var(--tx3);margin-top:6px;font-family:var(--fm)}
  /* 引用记录 */
  .kbref{background:var(--bg2);border:1px solid var(--ln);border-radius:var(--r2);
    padding:10px 12px;margin-bottom:7px}
  .kbref-h{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
  .kbref-q{font-size:12px;color:var(--tx);flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kbref-s{font-size:10px;font-family:var(--fm);color:var(--ok);
    background:rgba(52,211,153,.12);border-radius:3px;padding:0 5px;flex:0 0 auto}
  .kbref-m{font-size:10.5px;color:var(--tx3)}
  .kbref-m b{color:var(--tx2)}

  /* 测验 */
  .qzintro{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r3);padding:18px 20px;margin-bottom:14px}
  .qzin-h{font-size:14px;font-weight:600;margin-bottom:4px}
  .qzin-s{font-size:11.5px;color:var(--tx3);line-height:1.7;margin-bottom:16px}
  .qzin-s b{color:var(--tx2)}
  .qzin-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .qzin-k{font-size:11px;color:var(--tx3);flex:0 0 62px}
  .qzchips{display:flex;gap:5px;flex-wrap:wrap}
  .qzchip{font-size:11px;color:var(--tx3);background:var(--s2);border:1px solid var(--ln);
    border-radius:999px;padding:4px 11px;cursor:pointer;transition:all .18s var(--ez)}
  .qzchip:hover{color:var(--tx2);border-color:var(--ln2)}
  .qzchip.on{color:var(--tx);border-color:var(--acl);background:var(--acs)}
  .qzin-foot{display:flex;align-items:center;gap:8px;padding-top:13px;border-top:1px solid var(--ln)}
  .qzin-tip{font-size:10px;color:var(--tx3);flex:1}

  /* 题目卡片 */
  .qzcard{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r3);
    padding:18px 20px;margin-bottom:14px}
  .qzh{display:flex;align-items:center;gap:9px;margin-bottom:14px}
  .qzno{font-size:10.5px;font-family:var(--fm);color:var(--ac)}
  .qztype{font-size:9.5px;color:var(--tx3);background:var(--s3);border-radius:3px;padding:1px 6px}
  .qzprog{display:flex;gap:3px;margin-left:auto}
  .qzpd{width:16px;height:3px;border-radius:2px;background:var(--s3)}
  .qzpd.done{background:var(--ok)}
  .qzpd.cur{background:var(--ac)}
  .qzq{font-size:14px;color:var(--tx);line-height:1.65;margin-bottom:14px}
  .qzopts{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
  .qzopt{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--bg2);
    border:1px solid var(--ln);border-radius:var(--r2);cursor:pointer;
    transition:all .18s var(--ez);font-size:12px;color:var(--tx2)}
  .qzopt:hover{border-color:var(--ln2);background:var(--s2);color:var(--tx)}
  .qzopt.right{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.1);color:var(--tx)}
  .qzopt.wrong{border-color:rgba(248,113,113,.55);background:rgba(248,113,113,.09);color:var(--tx)}
  .qzo-dot{width:20px;height:20px;border-radius:50%;background:var(--s3);color:var(--tx3);
    display:flex;align-items:center;justify-content:center;font-size:10px;
    font-family:var(--fm);flex:0 0 auto}
  .qzopt.right .qzo-dot{background:var(--ok);color:#04222a}
  .qzopt.wrong .qzo-dot{background:var(--dg);color:#1a0808}
  .qzo-t{flex:1}
  .qzo-m{font-size:12px;flex:0 0 auto}
  .qzo-m.ok{color:var(--ok)}
  .qzo-m.no{color:var(--dg)}

  /* 答题反馈 */
  .qzfb{border-radius:var(--r2);padding:12px 14px;margin-bottom:12px;
    border-left:2px solid;background:var(--bg2)}
  .qzfb.ok{border-left-color:var(--ok);background:rgba(52,211,153,.06)}
  .qzfb.bad{border-left-color:var(--dg);background:rgba(248,113,113,.06)}
  .qzfb-h{font-size:11.5px;font-weight:600;margin-bottom:6px}
  .qzfb.ok .qzfb-h{color:var(--ok)}
  .qzfb.bad .qzfb-h{color:var(--dg)}
  .qzfb-w{font-size:11.5px;color:var(--tx2);line-height:1.7;margin-bottom:9px}
  .qzfb-r{font-size:10px;color:var(--tx3);display:flex;align-items:center;gap:8px}
  .qzfb-link{color:var(--ac);cursor:pointer}
  .qzfoot{display:flex;align-items:center;gap:8px}
  .qztip{font-size:10px;color:var(--tx3);flex:1}

  /* 结果 */
  .qzresult{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r3);
    padding:26px 20px;text-align:center;margin-bottom:14px}
  .qzr-big{font-size:32px;font-weight:600;font-family:var(--fm);color:var(--tx);
    letter-spacing:-.02em}
  .qzr-sub{font-size:12px;color:var(--tx3);margin-top:5px}
  .qzr-bar{width:min(280px,80%);height:4px;border-radius:2px;background:var(--s3);

function toggleGroup(key){
  const g = NAV.find(x=>x.key===key);
  if (opened.has(key)) opened.delete(key);
  else opened.add(key);
  // 点分组本身：如果里面有页面，跳到第一个
  if (!cur.sub || !NAV.find(x=>x.key===cur.nav)?.sub.some(s=>s.k===cur.sub)){
    go(g.sub[0].k);
  } else {
    renderNav();
  }
}

function findSub(k){
  for (const g of NAV) for (const s of g.sub) if (s.k===k) return { g, s };
  return null;
}

/* ================= 跳转 ================= */
function go(k){
  const hit = findSub(k);
  if (!hit){ toast('这个入口还没做'); return; }
  cur = { nav: hit.g.key, sub: k };
  opened.add(hit.g.key);
  renderNav();

  const frame = document.getElementById('canvasFrame');
  const page  = document.getElementById('pageView');

  if (k === 'canvas'){
    frame.classList.remove('hidden');
    page.classList.add('hidden');
    return;
  }
  frame.classList.add('hidden');
  page.classList.remove('hidden');
  page.innerHTML = renderPage(hit.g, hit.s);
  page.scrollTop = 0;
}

/* --------- 动作 --------- */
function startQuiz(){
  quiz.started = true; quiz.i = 0; quiz.pick = null; quiz.done = false;
  renderKBInto();
}
function submitQuiz(){
  if (quiz.pick === null) return;
  quiz.answers[quiz.i] = quiz.pick;
  renderKBInto();
}
function nextQuiz(){
  quiz.pick = null;
  if (quiz.i + 1 >= KB_QUIZ.length){ quiz.done = true; }
  else quiz.i++;
  renderKBInto();
}
function resetQuiz(){
  quiz.started = false; quiz.i = 0; quiz.pick = null;
  quiz.answers = []; quiz.done = false;
  renderKBInto();
}

function kbTabChunk(it){
  const n = Math.min(it.chunks||0, 5);

  return `
    <div class="kbsim">
      <div class="kbsimt">共 ${it.chunks||0} 段 · 下面是前 ${n} 段</div>
      ${Array.from({length:n},(_,i)=>{
        const seg = i+1;
        const isUsed = used.includes(seg);
        return `<div class="kbchunk">
          <span class="kbcn">${seg}</span>
          <div style="flex:1;min-width:0">
            <div class="kbcx">${it.k==='git'?'（文件片段）':'（段落 ' + seg + '）'}${isUsed?' <span class="kbusetag">被引用过</span>':''}</div>
            <div class="kbcv">向量 ${1024} 维 · 已入库 · 长度 ${80+seg*40} 字</div>

/* ---------- P5 ---------- */
const SR_STEPS = [1, 3, 7, 16, 35];
let wrongBox = [];
const DAYMS = 86400000;

function srAdd(qid){
  const now = Date.now();
  let it = wrongBox.find(w=>w.qid===qid);
  if (!it){ it = { qid, stage:0, due: now + SR_STEPS[0]*DAYMS, wrongCount:1 }; wrongBox.push(it); }
  else {
    it.wrongCount++;
    it.stage = Math.max(0, it.stage - 1);
    it.due = now + SR_STEPS[it.stage]*DAYMS;
  }
}
function srPass(qid){
  const it = wrongBox.find(w=>w.qid===qid);
  if (!it) return;
  it.stage++;
  if (it.stage >= SR_STEPS.length){ wrongBox = wrongBox.filter(w=>w.qid!==qid); return; }
  it.due = Date.now() + SR_STEPS[it.stage]*DAYMS;
}
function srDue(){ return wrongBox.filter(w=>w.due <= Date.now()); }
function srWhen(ts){
  const d = Math.round((ts - Date.now())/DAYMS);
  if (d <= 0) return '现在该复习';
  if (d === 1) return '明天';
  return d + ' 天后';
}

const _submitQuiz = submitQuiz;

  const q = KB_QUIZ[quiz.i];

  if (quiz.pick === q.a) srPass(q.id); else srAdd(q.id);

};
