<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>YLCraft 镜头墙 · 漫剧主视图 v13</title>
<style>
  :root{
    --bg:#08080a; --bg2:#0b0b0e; --s1:#101013; --s2:#16161a; --s3:#1c1c21;
    --ln:rgba(255,255,255,.065); --ln2:rgba(255,255,255,.11); --ln3:rgba(255,255,255,.18);
    --tx:#f0f0f3; --tx2:#9c9ca8; --tx3:#63636e;
    --ac:#22d3ee; --acs:rgba(34,211,238,.13); --acl:rgba(34,211,238,.4);
    --ok:#34d399; --oks:rgba(52,211,153,.12); --okl:rgba(52,211,153,.4);
    --wn:#fbbf24; --wns:rgba(251,191,36,.11); --wnl:rgba(251,191,36,.45);
    --dg:#f87171; --dgs:rgba(248,113,113,.1); --dgl:rgba(248,113,113,.45);
    --r1:5px;--r2:8px;--r3:12px;--r4:16px;
    --sh2:0 6px 22px -8px rgba(0,0,0,.85);
    --sh3:0 24px 70px -20px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.07);
    --ez:cubic-bezier(.16,1,.3,1);
    --fs:'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    --fm:'JetBrains Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--tx);font-family:var(--fs);font-size:13px;
       line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden;
       -webkit-user-select:none;user-select:none}
  button{font-family:inherit}
  .hidden{display:none!important}
  .ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.55;
      stroke-linecap:round;stroke-linejoin:round;display:block;flex:0 0 auto}
  .ic.sm{width:13px;height:13px;stroke-width:1.7}
  .b{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--tx2);
     background:transparent;border:1px solid transparent;padding:6px 10px;border-radius:var(--r2);
     cursor:pointer;transition:all .22s var(--ez);white-space:nowrap;flex:0 0 auto}
  .b:hover{color:var(--tx);background:var(--s3)}
  .b.out{border-color:var(--ln);background:var(--s1)}
  .b.solid{color:#04222a;background:var(--ac);font-weight:600}

  /* 顶栏 */
  .top{position:fixed;top:0;left:0;right:0;height:52px;z-index:60;display:flex;align-items:center;
    gap:10px;padding:0 14px;border-bottom:1px solid var(--ln);
    background:linear-gradient(to bottom,rgba(8,8,10,.99),rgba(8,8,10,.86));backdrop-filter:blur(18px)}
  .brand{display:flex;align-items:center;gap:7px;padding:5px 9px 5px 6px;border-radius:var(--r2);
    background:var(--s1);border:1px solid var(--ln);flex:0 0 auto}
  .brand .mk{width:20px;height:20px;border-radius:var(--r1);background:var(--ac);
    display:flex;align-items:center;justify-content:center;color:#04222a;font-weight:800;font-size:11px}
  .crumb{font-size:12px;color:var(--tx3);flex:0 0 auto}
  .crumb b{color:var(--tx2);font-weight:500}
  .saved{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--tx3)}
  .saved .d{width:5px;height:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--oks)}
  .seg{display:flex;gap:1px;padding:3px;background:var(--s1);border:1px solid var(--ln);border-radius:999px}
  .seg button{font-size:12px;color:var(--tx3);background:0;border:0;padding:4px 13px;
    border-radius:999px;cursor:pointer;transition:all .28s var(--ez);display:flex;align-items:center;gap:6px}
  .seg button.on{background:#f2f2f5;color:#0a0a0c;font-weight:600}

  #main{position:fixed;top:52px;left:0;right:0;bottom:0;display:flex}
  .wall{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}

  /* 头部信息条 */
  .sbar{display:flex;align-items:center;gap:10px;padding:7px 16px;
    border-bottom:1px solid var(--ln);background:rgba(8,8,10,.5);flex:0 0 auto}
  .sbar .ttl{font-size:12.5px;color:var(--tx)}
  .sbar .meta{font-size:11px;color:var(--tx3);font-family:var(--fm)}
  .sbar .meta sep{opacity:.4}
  .sbar .sp{margin-left:auto}

  /* 网格 */
  .grid{flex:1;overflow-y:auto;padding:10px 16px 8px;display:grid;
    grid-template-columns:repeat(6,minmax(0,1fr));gap:11px;align-content:start}
  .grid::-webkit-scrollbar{width:8px}
  .grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}

  /* 镜头卡 */
  .shot{position:relative;display:flex;flex-direction:column;height:136px;
    background:var(--s1);border:1px solid var(--ln);border-radius:var(--r3);
    overflow:hidden;cursor:grab;transition:all .24s var(--ez)}
  .shot:hover{border-color:var(--ln2);transform:translateY(-2px);box-shadow:var(--sh2)}
  .shot.dragging{opacity:.4;cursor:grabbing}
  .shot.over{border-color:var(--ac);border-style:dashed;transform:scale(.97)}
  .shot.sel{border-color:var(--acl);box-shadow:0 0 0 1.5px var(--acl),0 10px 30px -10px rgba(34,211,238,.45)}
  .shot .im{position:relative;flex:1;min-height:0;overflow:hidden;position:relative}
  .shot .im .f{position:absolute;inset:0}
  .shot .fig{position:absolute;left:46%;top:24%;width:15%;height:56%;
    background:linear-gradient(175deg,#e8d5bd,#a8825c);border-radius:42% 42% 20% 20%/16% 16% 8% 8%}
  .shot .glow{position:absolute;inset:0;
    background:radial-gradient(circle at 62% 32%,rgba(255,214,150,.22),transparent 55%)}

  /* 镜号徽章 */
  .shot .no{position:absolute;left:7px;top:7px;z-index:3;min-width:20px;height:18px;
    padding:0 5px;border-radius:var(--r1);background:rgba(8,8,10,.72);backdrop-filter:blur(6px);
    color:var(--tx);font-size:10px;font-family:var(--fm);font-weight:600;
    display:flex;align-items:center;justify-content:center}
  /* 状态点 */
  .shot .stt{position:absolute;right:7px;top:7px;z-index:3;width:7px;height:7px;border-radius:50%}
  .stt.ok{background:var(--ok);box-shadow:0 0 0 2.5px rgba(52,211,153,.22)}
  .stt.run{background:var(--ac);animation:pulse 1.2s ease-in-out infinite}
  .stt.err{background:var(--dg);box-shadow:0 0 0 2.5px rgba(248,113,113,.22)}
  .stt.todo{background:var(--tx3)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  /* 底部信息 */
  .shot .info{flex:0 0 auto;padding:6px 8px 7px;background:var(--s1)}
  .shot .nm{font-size:11px;color:var(--tx2);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;line-height:1.4}
  .shot .ln{display:flex;align-items:center;gap:5px;font-size:9.5px;color:var(--tx3);
    font-family:var(--fm);margin-top:1px}
  .shot .ln .d{margin-left:auto}
  /* 失败态 */
  .shot.err .im .f{filter:grayscale(.6) brightness(.5)}
  .shot .errbadge{position:absolute;left:0;right:0;bottom:0;padding:5px;
    background:linear-gradient(to top,rgba(248,113,113,.16),transparent);
    font-size:9.5px;color:var(--dg);text-align:center;z-index:2}
  /* 待生成 */
  .shot.todo .im .f{opacity:.3}
  .shot .todobadge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:4px;z-index:2;color:var(--tx3);font-size:10.5px}

  /* 时间线 */
  .tl{flex:0 0 auto;border-top:1px solid var(--ln);padding:8px 16px 9px;
    background:rgba(8,8,10,.6)}
  .tl .tr{display:flex;align-items:center;gap:5px;margin-bottom:8px}
  .tl .play{width:28px;height:28px;border-radius:50%;background:#f2f2f5;color:#0a0a0c;
    border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  .tl .time{font-size:11px;color:var(--tx2);font-family:var(--fm);margin-left:6px}
  .tl .time b{color:var(--tx)}
  .tl .right{margin-left:auto;font-size:10.5px;color:var(--tx3);font-family:var(--fm)}
  .track{display:flex;height:26px;gap:2px;align-items:stretch;cursor:pointer}
  .seg2{flex:1;border-radius:3px;position:relative;overflow:hidden;transition:all .2s var(--ez);
    display:flex;align-items:center;justify-content:center;font-size:9px;font-family:var(--fm);
    color:rgba(0,0,0,.55);font-weight:600}
  .seg2:hover{filter:brightness(1.25)}
  .seg2.sel{outline:2px solid var(--ac);outline-offset:1px}
  .seg2.ok{background:#5eead4}
  .seg2.run{background:var(--ac);animation:pulse 1.2s ease-in-out infinite}
  .seg2.err{background:var(--dg)}
  .seg2.todo{background:var(--s3);color:var(--tx3)}
  .ruler{display:flex;justify-content:space-between;font-size:9px;color:var(--tx3);
    font-family:var(--fm);margin-top:4px}

  /* Agent */
  .ag{width:420px;flex:0 0 420px;background:var(--s1);border-left:1px solid var(--ln);
    display:flex;flex-direction:column;z-index:25;min-height:0;overflow:hidden}
  .agh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--ln)}
  .agh .t{font-size:12px;font-weight:600}
  .agh .m{margin-left:auto;font-size:10px;color:var(--tx3);font-family:var(--fm)}
  .agb{flex:1;overflow-y:auto;padding:14px;min-height:0}
  .agb::-webkit-scrollbar{width:6px}
  .agb::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
  .msg{margin-bottom:14px}
  .msg.me{display:flex;justify-content:flex-end}
  .msg.me .bubble{background:var(--s3);border:1px solid var(--ln);
    border-radius:var(--r2) var(--r2) 3px var(--r2);padding:10px 13px;font-size:12.5px;
    color:var(--tx);line-height:1.65;max-width:300px}
  .msg.ai .who{font-size:10px;color:var(--tx3);margin-bottom:6px}
  .msg.ai .bubble{background:var(--bg2);border:1px solid var(--ln);
    border-radius:var(--r2) var(--r2) var(--r2) 3px;padding:12px 14px;
    font-size:12.5px;color:var(--tx2);line-height:1.75}
  .msg.ai .bubble b{color:var(--tx);font-weight:600}
  .spec{display:flex;flex-direction:column;gap:6px;margin-top:9px}
  .spec .row{display:flex;gap:9px;font-size:12px;line-height:1.65;color:var(--tx2)}
  .spec .k{flex:0 0 auto;color:var(--tx3);min-width:48px}
  .spec .v{color:var(--tx2)} .spec .v b{color:var(--tx);font-weight:500}
  .cmp{border-top:1px solid var(--ln);padding:9px 12px 11px;background:rgba(8,8,10,.5)}
  .cmp .bx{background:var(--bg2);border:1px solid var(--ln2);border-radius:var(--r3);padding:9px 10px;
    display:flex;align-items:center;gap:8px}
  .cmp textarea{flex:1;background:0;border:0;color:var(--tx);font-family:inherit;
    font-size:12.5px;resize:none;outline:none;line-height:1.6;max-height:60px}
  .cmp textarea::placeholder{color:var(--tx3)}
  .cmp .snd{width:26px;height:26px;border-radius:var(--r2);background:var(--ac);border:0;
    color:#04222a;display:flex;align-items:center;justify-content:center;cursor:pointer}

  .toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:500;
    display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--tx);
    background:rgba(16,16,19,.97);backdrop-filter:blur(24px);border-radius:999px;
    padding:7px 15px;box-shadow:0 12px 34px -10px rgba(0,0,0,.9);animation:toastIn .3s var(--ez)}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
  .hint{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:60;
    font-size:11px;color:var(--tx3);background:rgba(16,16,19,.9);backdrop-filter:blur(20px);
    border:1px solid var(--ln2);border-radius:999px;padding:4px 13px;pointer-events:none}
  .hint b{color:var(--tx2)}
</style>
</head>
<body>

<div class="top">
  <div class="brand"><span class="mk">YL</span><span style="font-size:12.5px;font-weight:600">YLCraft</span></div>
  <div class="crumb"><b>我的短剧</b> / 第 3 集</div>
  <div class="saved"><span class="d"></span>已保存到本地</div>
  <div class="seg" style="margin-left:6px">
    <button class="on">
      <svg class="ic sm" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>镜头墙
    </button>
    <button>
      <svg class="ic sm" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 12l9 4 9-4"/></svg>自由画布
    </button>
  </div>
  <div style="margin-left:auto;display:flex;gap:6px">
    <button class="b out" onclick="inspectDemo()"><svg class="ic sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.4-3.4"/></svg>巡检</button>
    <button class="b solid"><svg class="ic sm" viewBox="0 0 24 24"><path d="M5 3l14 9-14 9z"/></svg>出片</button>
  </div>
</div>

<div id="main">
  <div class="wall">
    <div class="sbar">
      <span class="ttl">第 3 集 · 镜头墙</span>
      <span class="meta" id="metaBar">12 个镜头 · 总时长 00:42 · 9 已生成 / 1 生成中 / 1 失败 / 1 待生成</span>
      <span class="sp"></span>
      <button class="b" onclick="addShot()">
        <svg class="ic sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>加一镜
      </button>
    </div>

    <div class="grid" id="grid"></div>

    <div class="tl">
      <div class="tr">
        <button class="play"><svg class="ic sm" viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M6 4l14 8-14 8z"/></svg></button>
        <span class="time"><b id="curTime">00:00</b> / <span id="totalTime">00:42</span></span>
        <span class="right" id="tlRight">按时长比例 · 拖动卡片可换顺序</span>
      </div>
      <div class="track" id="track"></div>
      <div class="ruler"><span>00:00</span><span>00:10</span><span>00:21</span><span>00:31</span><span>00:42</span></div>
    </div>
  </div>

  <aside class="ag">
    <div class="agh">
      <svg class="ic sm" viewBox="0 0 24 24" style="color:var(--ac)"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>
      <span class="t">智能体</span>
      <span class="m">gpt-image-2</span>
    </div>
    <div class="agb" id="agb">
      <div class="msg ai">
        <div class="who">智能体</div>
        <div class="bubble">第 3 集的镜头墙在这里。<b>点镜头可选中，拖动可换顺序</b>，换完镜号会自动重排。<br><br>
        要拆镜头、补镜头、或者只改某一镜，直接跟我说。</div>
      </div>
    </div>
    <div class="cmp">
      <div class="bx">
        <textarea id="ta" rows="1" placeholder="比如：把第 2 镜拆成中景和特写"></textarea>
        <button class="snd" onclick="send()"><svg class="ic sm" viewBox="0 0 24 24" style="stroke-width:2"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      </div>
    </div>
  </aside>
</div>

<div class="hint" id="hintBar">拖动卡片可以换顺序 · 镜号会自动重排</div>

<script>
/* ============ 数据 ============ */
const CLS = ['g1','g2','g3','g4','g5','g6'];
const BG = {
  g1:'linear-gradient(165deg,#4a3520,#2a1d12 45%,#17110b)',
  g2:'linear-gradient(165deg,#1e2a35,#0d141b)',
  g3:'linear-gradient(165deg,#2b2440,#141020)',
  g4:'linear-gradient(165deg,#243027,#111a15)',
  g5:'linear-gradient(165deg,#33262b,#1a1216)',
  g6:'linear-gradient(165deg,#2a3320,#12180d)'
};
let SHOTS = [
  {n:'中景推进', d:4.2, st:'ok'},
  {n:'特写',     d:3.1, st:'ok'},
  {n:'侧身回头', d:5.0, st:'ok'},
  {n:'过场',     d:2.8, st:'ok'},
  {n:'中景',     d:4.5, st:'ok'},
  {n:'近景',     d:3.3, st:'ok'},
  {n:'远景',     d:4.0, st:'err'},
  {n:'特写',     d:3.6, st:'ok'},
  {n:'转身',     d:4.8, st:'ok'},
  {n:'过场',     d:2.2, st:'run'},
  {n:'中景',     d:3.9, st:'ok'},
  {n:'收尾',     d:0.0, st:'todo'}
];
let selIdx = -1;
let dragIdx = -1;
const grid = document.getElementById('grid');
const track = document.getElementById('track');
const agb = document.getElementById('agb');

/* ============ 渲染 ============ */
function render(){
  grid.innerHTML = '';
  SHOTS.forEach((s, i)=>{
    const el = document.createElement('div');
    el.className = 'shot' + (i===selIdx?' sel':'') + (s.st==='err'?' err':'') + (s.st==='todo'?' todo':'');
    el.draggable = true;
    el.dataset.i = i;
    const cls = CLS[i % CLS.length];
    el.innerHTML =
      `<div class="im" style="background:${BG[cls]}">`
      + `<div class="glow"></div><div class="fig"></div>`
      + (s.st==='err' ? '<div class="errbadge">生成失败 · 403</div>' : '')
      + (s.st==='todo' ? '<div class="todobadge">'
          + '<svg class="ic" viewBox="0 0 24 24" style="color:var(--tx3)"><path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg>'
          + '待生成</div>' : '')
      + `<span class="no">${String(i+1).padStart(2,'0')}</span>`
      + `<span class="stt ${s.st}"></span>`
      + `</div>`
      + `<div class="info"><div class="nm">${s.n}</div>`
      + `<div class="ln"><span>${s.d>0?s.d.toFixed(1)+'s':'—'}</span>`
      + `<span class="d">${s.st==='ok'?'1024×1536':s.st==='err'?'403':s.st==='run'?'生成中':'—'}</span></div></div>`;
    el.addEventListener('click', ()=>{ if(s.st!=='todo'){ selIdx=i; render(); } });
    // 拖拽
    el.addEventListener('dragstart', e=>{
      dragIdx = i; el.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      try { e.dataTransfer.setData('text/plain', String(i)); } catch(_){}
    });
    el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); dragIdx=-1; });
    el.addEventListener('dragover', e=>{
      e.preventDefault(); e.dataTransfer.dropEffect='move';
      if (dragIdx!==-1 && dragIdx!==i) el.classList.add('over');
    });
    el.addEventListener('dragleave', ()=> el.classList.remove('over'));
    el.addEventListener('drop', e=>{
      e.preventDefault(); el.classList.remove('over');
      if (dragIdx===-1 || dragIdx===i) return;
      const moved = SHOTS.splice(dragIdx,1)[0];
      SHOTS.splice(i,0,moved);
      selIdx = i;
      render();
      const from = Math.min(dragIdx,i)+1, to = Math.max(dragIdx,i)+1;
      toast(`镜头 ${from} 移到第 ${i+1} 位 · 镜号已重排`);
      document.getElementById('hintBar').innerHTML = `已把镜头 <b>${from}</b> 移到第 <b>${i+1}</b> 位 · 后面镜号依次后移`;
    });
    grid.appendChild(el);
  });
  renderTimeline();
  renderMeta();
}
function renderTimeline(){
  track.innerHTML = '';
  const total = SHOTS.reduce((a,s)=>a+s.d,0) || 1;
  SHOTS.forEach((s,i)=>{
    const el = document.createElement('div');
    el.className = 'seg2 ' + s.st + (i===selIdx?' sel':'');
    el.style.flex = String(Math.max(s.d, 0.4) / total);
    el.textContent = s.d>0 ? s.d.toFixed(1) : '';
    el.title = `镜头 ${i+1} · ${s.n} · ${s.d>0?s.d.toFixed(1)+'s':'待生成'}`;
    el.addEventListener('click', ()=>{ if(s.st!=='todo'){ selIdx=i; render(); } });
    track.appendChild(el);
  });
  const t = total;
  document.getElementById('totalTime').textContent = fmt(t);
  document.getElementById('curTime').textContent = selIdx>=0
    ? fmt(SHOTS.slice(0,selIdx).reduce((a,s)=>a+s.d,0))
    : '00:00';
}
function renderMeta(){
  const c = k => SHOTS.filter(s=>s.st===k).length;
  document.getElementById('metaBar').textContent =
    `${SHOTS.length} 个镜头 · 总时长 ${fmt(SHOTS.reduce((a,s)=>a+s.d,0))} · `
    + `${c('ok')} 已生成 / ${c('run')} 生成中 / ${c('err')} 失败 / ${c('todo')} 待生成`;
}
function fmt(sec){
  const m = Math.floor(sec/60), s = Math.round(sec%60);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

/* ============ 操作 ============ */
function addShot(){
  SHOTS.push({n:'新镜头', d:0, st:'todo'});
  selIdx = SHOTS.length-1;
  render();
  toast('已加一镜 · 待生成');
  // 时间线滚到底
  const g = document.getElementById('grid');
  g.scrollTop = g.scrollHeight;
}
function splitShot(i){
  const s = SHOTS[i];
  if (!s) return;
  const a = {n:s.n+'A（中景）', d:Math.round(s.d*0.6*10)/10, st:'todo'};
  const b = {n:s.n+'B（特写）', d:Math.round(s.d*0.4*10)/10, st:'todo'};
  SHOTS.splice(i, 1, a, b);
  render();
}

/* ============ 对话演示 ============ */
function send(){
  const ta = document.getElementById('ta');
  const t = ta.value.trim(); if(!t) return;
  ta.value=''; ta.rows=1;
  addMe(t);
  setTimeout(()=>{
    // 简化：识别"第 N 镜"+"拆"
    const m = t.match(/第\s*(\d+)\s*镜/);
    const idx = m ? (+m[1]) - 1 : Math.max(selIdx, 1);
    if (/拆/.test(t)){
      const before = SHOTS.length;
      splitShot(idx);
      const oldNo = idx+1;
      agentReply(
        `拆好了。第 ${oldNo} 镜分成两镜，<b>后面所有镜号已经自动重排</b>。`,
        [
          ['原镜头','「'+SHOTS[idx].n.replace(/A（.*）/,'')+'」'],
          ['拆成','2A 中景 / 2B 特写'],
          ['镜号','12 → '+SHOTS.length+' 镜，后续依次后移'],
          ['状态','两个新镜头都是<b>待生成</b>']
        ],
        '要我接着把这两镜生成出来吗？会花两镜的钱。'
      );
      document.getElementById('hintBar').innerHTML = `第 ${oldNo} 镜已拆成两镜 · 镜号已重排`;
    } else {
      agentReply('收到。', [['操作','这一步是原型，只演示了「拆镜头」']], '试试说：把第 2 镜拆成中景和特写。');
    }
  }, 600);
}
function addMe(t){
  const d = document.createElement('div');
  d.className='msg me';
  d.innerHTML = `<div class="bubble">${esc(t)}</div>`;
  agb.appendChild(d); agb.scrollTop = agb.scrollHeight;
}
function agentReply(intro, rows, tail){
  const d = document.createElement('div');
  d.className='msg ai';
  d.innerHTML = `<div class="who">智能体</div><div class="bubble">${intro}`
    + `<div class="spec">` + rows.map(r=>`<div class="row"><span class="k">${r[0]}</span><span class="v">${r[1]}</span></div>`).join('') + `</div>`
    + (tail?`<div style="margin-top:10px;font-size:12.5px;line-height:1.7">${tail}</div>`:'')
    + `</div>`;
  agb.appendChild(d); agb.scrollTop = agb.scrollHeight;
}
function inspectDemo(){
  document.getElementById('hintBar').innerHTML = '巡检 → 见 v12 原型（这版只做镜头墙）';
  toast('巡检在 v12 原型里');
}
function esc(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(t){
  const old=document.querySelector('.toast'); if(old) old.remove();
  const d=document.createElement('div'); d.className='toast';
  d.innerHTML='<svg class="ic sm" viewBox="0 0 24 24" style="color:var(--ac)"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>'+t;
  document.body.appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .4s';},2200);
  setTimeout(()=>d.remove(),2700);
}
const ta = document.getElementById('ta');
ta.addEventListener('input', ()=>{ ta.rows = Math.min(3, Math.max(1, Math.ceil(ta.value.length/34)||1)); });
ta.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } });

render();
</script>
</body>
</html>
